<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.star{fill:#e0f2fe;animation:tw 3.2s ease-in-out infinite}
.s2{animation-delay:1.1s}
.s3{animation-delay:2.2s}
.s4{animation-delay:.6s}
.s5{animation-delay:1.7s}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
.title{font-family:'Segoe UI',Verdana,Arial,sans-serif;font-weight:800;font-size:86px;letter-spacing:8px}
.sub{font-family:Consolas,'Courier New',monospace;font-size:21px;letter-spacing:5px;fill:#7dd3fc;opacity:.85}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
<stop stop-color="#020617"/>
<stop offset=".45" stop-color="#0a1a45"/>
<stop offset=".75" stop-color="#0c2f6e"/>
<stop offset="1" stop-color="#020617"/>
</linearGradient>
<linearGradient id="tg" x1="300" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
<stop stop-color="#93c5fd"/>
<stop offset=".5" stop-color="#38bdf8"/>
<stop offset="1" stop-color="#2563eb"/>
</linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="1000" height="280" fill="url(#bg)"/>
<circle class="star" cx="80" cy="50" r="1.4"/>
<circle class="star s2" cx="160" cy="120" r="1"/>
<circle class="star s3" cx="240" cy="40" r="1.2"/>
<circle class="star s4" cx="320" cy="90" r=".9"/>
<circle class="star s5" cx="120" cy="200" r="1.1"/>
<circle class="star s2" cx="420" cy="45" r="1.3"/>
<circle class="star s4" cx="520" cy="70" r=".8"/>
<circle class="star" cx="600" cy="35" r="1.2"/>
<circle class="star s3" cx="680" cy="100" r="1"/>
<circle class="star s5" cx="760" cy="55" r="1.4"/>
<circle class="star s2" cx="840" cy="130" r="1"/>
<circle class="star" cx="910" cy="60" r="1.2"/>
<circle class="star s4" cx="950" cy="180" r=".9"/>
<circle class="star s3" cx="60" cy="150" r="1"/>
<circle class="star s5" cx="880" cy="220" r="1.1"/>
<circle class="star s2" cx="300" cy="215" r=".9"/>
<circle class="star s4" cx="700" cy="205" r="1"/>
<path d="M0 236 C 180 200 320 268 520 240 C 700 214 840 262 1000 228 L 1000 280 L 0 280 Z" fill="#38bdf8" opacity=".10"/>
<path d="M0 252 C 200 226 400 276 620 252 C 800 232 900 268 1000 248 L 1000 280 L 0 280 Z" fill="#60a5fa" opacity=".14"/>
<text x="500" y="152" text-anchor="middle" class="title" fill="url(#tg)" filter="url(#glow)">FURKIBEA</text>
<text x="500" y="198" text-anchor="middle" class="sub">engineered, not scripted.</text>
</svg>
