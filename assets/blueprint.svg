<svg width="940" height="360" viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-family:Consolas,'Courier New',monospace}
.flow{stroke:#1e40af;stroke-width:2;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.box{fill:#0b1b3d;stroke-width:2;rx:10}
.nt{font-size:16px;font-weight:bold;fill:#7dd3fc}
.ns{font-size:11.5px;fill:#64748b}
</style>
<rect x="1" y="1" width="938" height="358" rx="14" fill="#050a1f" stroke="#1e3a8a" stroke-width="2"/>
<text class="t" x="36" y="44" font-size="14" fill="#475569">// blueprint &#8212; what happens to every packet</text>
<circle cx="700" cy="40" r="5" fill="#38bdf8"/>
<text class="t" x="712" y="45" font-size="12" fill="#64748b">player</text>
<circle cx="800" cy="40" r="5" fill="#ef4444"/>
<text class="t" x="812" y="45" font-size="12" fill="#64748b">exploiter</text>
<line class="flow" x1="190" y1="170" x2="305" y2="170"/>
<line class="flow" x1="455" y1="170" x2="565" y2="170"/>
<line class="flow" x1="705" y1="170" x2="765" y2="170"/>
<rect x="40" y="120" width="150" height="100" rx="10" fill="#0b1b3d" stroke="#38bdf8" stroke-width="2"/>
<text class="t nt" x="115" y="152" text-anchor="middle">CLIENT</text>
<text class="t ns" x="115" y="178" text-anchor="middle">draws pretty things</text>
<text class="t ns" x="115" y="198" text-anchor="middle">trust level: 0</text>
<rect x="305" y="120" width="150" height="100" rx="10" fill="#0b1b3d" stroke="#22c55e" stroke-width="2"/>
<text class="t nt" x="380" y="152" text-anchor="middle">VALIDATION</text>
<text class="t ns" x="380" y="178" text-anchor="middle">if not sane</text>
<text class="t ns" x="380" y="198" text-anchor="middle">then kick</text>
<rect x="565" y="120" width="140" height="100" rx="10" fill="#0b1b3d" stroke="#38bdf8" stroke-width="2"/>
<text class="t nt" x="635" y="152" text-anchor="middle">SYSTEMS</text>
<text class="t ns" x="635" y="178" text-anchor="middle">modular</text>
<text class="t ns" x="635" y="198" text-anchor="middle">game logic</text>
<rect x="765" y="120" width="140" height="100" rx="10" fill="#0b1b3d" stroke="#38bdf8" stroke-width="2"/>
<text class="t nt" x="835" y="152" text-anchor="middle">DATASTORE</text>
<text class="t ns" x="835" y="178" text-anchor="middle">session-locked</text>
<text class="t ns" x="835" y="198" text-anchor="middle">saves</text>
<text class="t" x="380" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#22c55e" opacity="0">&#10003; valid
<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.30;0.35;0.44;0.50;1"/></text>
<text class="t" x="380" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#ef4444" opacity="0">&#10007; nice try
<animate attributeName="opacity" dur="6s" begin="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.30;0.35;0.50;0.60;1"/></text>
<g opacity="0">
<circle r="10" fill="#38bdf8" opacity=".22"/>
<circle r="5.5" fill="#38bdf8"/>
<animateMotion dur="6s" repeatCount="indefinite" path="M190 170 L380 170 L635 170 L835 170" keyPoints="0;0.295;0.295;1" keyTimes="0;0.28;0.40;1" calcMode="linear"/>
<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.94;1"/>
</g>
<g opacity="0">
<circle r="10" fill="#ef4444" opacity=".22"/>
<circle r="5.5" fill="#ef4444"/>
<animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M190 205 L380 205" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"/>
<animate attributeName="opacity" dur="6s" begin="3s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.33;0.45;1"/>
</g>
<text class="t" x="470" y="332" text-anchor="middle" font-size="15" fill="#94a3b8" letter-spacing="1">the server holds the truth. the client just draws it.</text>
</svg>
