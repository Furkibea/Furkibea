<svg width="940" height="360" viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-family:Consolas,'Courier New',monospace}
.pL{animation:pl 4s ease-in-out infinite}
.pR{animation:pr 4s ease-in-out infinite}
@keyframes pl{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes pr{0%,100%{transform:translateY(30px)}50%{transform:translateY(0)}}
.coin{animation:bk 1.6s steps(1) infinite}
@keyframes bk{0%,55%{opacity:1}56%,100%{opacity:0}}
</style>
<defs>
<radialGradient id="scr" cx=".5" cy=".45" r=".9">
<stop offset="0" stop-color="#081226"/>
<stop offset="1" stop-color="#02060f"/>
</radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".72">
<stop offset=".62" stop-color="#000209" stop-opacity="0"/>
<stop offset="1" stop-color="#000209" stop-opacity=".6"/>
</radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1.4" y="0" fill="#8fb7ff" opacity=".05"/>
</pattern>
<filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="3.5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="1" y="1" width="938" height="358" rx="18" fill="#0d1526" stroke="#1e293b" stroke-width="2"/>
<rect x="18" y="14" width="904" height="312" rx="12" fill="url(#scr)" stroke="#12213f" stroke-width="2"/>
<line x1="470" y1="70" x2="470" y2="310" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="10 12" filter="url(#neon)"/>
<text class="t" x="430" y="112" text-anchor="end" font-size="42" font-weight="bold" fill="#22d3ee" filter="url(#neon)">0</text>
<text class="t" x="510" y="112" text-anchor="start" font-size="42" font-weight="bold" fill="#4ade80" filter="url(#neon)">&#8734;</text>
<text class="t" x="430" y="132" text-anchor="end" font-size="11" fill="#475569" letter-spacing="2">CLIENT</text>
<text class="t" x="510" y="132" text-anchor="start" font-size="11" fill="#475569" letter-spacing="2">SERVER</text>
<g transform="translate(76,200)"><rect class="pL" x="-6" y="-32" width="12" height="64" rx="3" fill="#22d3ee" filter="url(#neon)"/></g>
<g transform="translate(864,170)"><rect class="pR" x="-6" y="-32" width="12" height="64" rx="3" fill="#4ade80" filter="url(#neon)"/></g>
<g opacity=".18">
<rect x="-4" y="-4" width="8" height="8" fill="#f8fafc"/>
<animateMotion dur="4s" begin="-0.16s" repeatCount="indefinite" path="M 95 200 L 320 95 L 600 305 L 845 170 L 600 95 L 320 305 L 95 200"/>
</g>
<g opacity=".45">
<rect x="-5" y="-5" width="10" height="10" fill="#f8fafc"/>
<animateMotion dur="4s" begin="-0.08s" repeatCount="indefinite" path="M 95 200 L 320 95 L 600 305 L 845 170 L 600 95 L 320 305 L 95 200"/>
</g>
<g>
<rect x="-6" y="-6" width="12" height="12" fill="#f8fafc" filter="url(#neon)"/>
<animateMotion dur="4s" repeatCount="indefinite" path="M 95 200 L 320 95 L 600 305 L 845 170 L 600 95 L 320 305 L 95 200"/>
</g>
<g opacity="0">
<rect x="-6" y="-6" width="12" height="12" fill="#f87171" filter="url(#neon)"/>
<animateMotion dur="8s" begin="1.5s" repeatCount="indefinite" path="M 95 250 L 460 250" keyPoints="0;1;1" keyTimes="0;0.22;1" calcMode="linear"/>
<animate attributeName="opacity" dur="8s" begin="1.5s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.215;0.23;1"/>
</g>
<circle cx="466" cy="250" r="3" fill="none" stroke="#f87171" stroke-width="2.5" opacity="0" filter="url(#neon)">
<animate attributeName="r" dur="8s" begin="1.5s" repeatCount="indefinite" values="3;3;24;3" keyTimes="0;0.215;0.30;1"/>
<animate attributeName="opacity" dur="8s" begin="1.5s" repeatCount="indefinite" values="0;0;.9;0;0" keyTimes="0;0.21;0.24;0.31;1"/>
</circle>
<text class="t" x="466" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#f87171" letter-spacing="3" opacity="0" filter="url(#neon)">NICE TRY
<animate attributeName="opacity" dur="8s" begin="1.5s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.215;0.24;0.36;0.44;1"/></text>
<text class="t coin" x="44" y="314" font-size="12" fill="#155e75" letter-spacing="2">INSERT COIN</text>
<text class="t" x="896" y="314" text-anchor="end" font-size="12" fill="#334155" letter-spacing="1">RALLY #919177</text>
<rect x="18" y="14" width="904" height="312" rx="12" fill="url(#scan)"/>
<rect x="18" y="14" width="904" height="312" rx="12" fill="url(#vig)"/>
<text class="t" x="470" y="348" text-anchor="middle" font-size="13" fill="#475569" letter-spacing="1">the server holds the truth. the client just draws it.</text>
</svg>
