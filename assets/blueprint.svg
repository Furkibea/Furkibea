<svg width="940" height="360" viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-family:Consolas,'Courier New',monospace}
.padL{transform-box:fill-box;transform-origin:center;animation:hl 3.6s ease-in-out infinite}
.padR{transform-box:fill-box;transform-origin:center;animation:hr 3.6s ease-in-out infinite}
@keyframes hl{0%,6%{transform:rotate(16deg)}12%,88%{transform:rotate(-10deg)}94%,100%{transform:rotate(16deg)}}
@keyframes hr{0%,44%{transform:rotate(10deg)}50%,56%{transform:rotate(-16deg)}62%,100%{transform:rotate(10deg)}}
.netf{animation:nf 7.2s linear 1.2s infinite}
@keyframes nf{0%,20%,34%,100%{stroke:#1e3a8a}24%,30%{stroke:#ef4444}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#0a142e" stroke-width="1"/>
</pattern>
<linearGradient id="bg2" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
<stop stop-color="#030816"/>
<stop offset="1" stop-color="#060d24"/>
</linearGradient>
</defs>
<rect x="1" y="1" width="938" height="358" rx="14" fill="url(#bg2)" stroke="#1e3a8a" stroke-width="2"/>
<rect x="1" y="1" width="938" height="358" rx="14" fill="url(#grid)" opacity=".8"/>
<text class="t" x="36" y="46" font-size="14" fill="#475569">// the rally &#8212; my netcode, as table tennis</text>
<text class="t" x="904" y="46" font-size="12" fill="#475569" text-anchor="end">rally #919177 in progress</text>
<rect x="370" y="24" width="200" height="34" rx="8" fill="#0b1b3d" stroke="#1e3a8a" stroke-width="1.5"/>
<text class="t" x="470" y="46" text-anchor="middle" font-size="13" fill="#7dd3fc">SERVER &#8734; : 0 EXPLOITS</text>
<rect x="130" y="266" width="680" height="8" rx="4" fill="#1d4ed8"/>
<rect x="150" y="274" width="10" height="30" fill="#0b1b3d"/>
<rect x="780" y="274" width="10" height="30" fill="#0b1b3d"/>
<line class="netf" x1="470" y1="266" x2="470" y2="200" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="4 4"/>
<text class="t" x="470" y="290" text-anchor="middle" font-size="11" fill="#64748b">validation net</text>
<g transform="translate(165,215)"><g class="padL"><ellipse cx="0" cy="-22" rx="15" ry="26" fill="#38bdf8"/><ellipse cx="0" cy="-22" rx="8" ry="15" fill="#0b1b3d" opacity=".35"/><rect x="-5" y="2" width="10" height="26" rx="4" fill="#b45309"/></g></g>
<text class="t" x="165" y="318" text-anchor="middle" font-size="12" fill="#64748b">CLIENT &#183; trust level: 0</text>
<g transform="translate(775,215)"><g class="padR"><ellipse cx="0" cy="-22" rx="15" ry="26" fill="#22c55e"/><ellipse cx="0" cy="-22" rx="8" ry="15" fill="#0b1b3d" opacity=".35"/><rect x="-5" y="2" width="10" height="26" rx="4" fill="#b45309"/></g></g>
<text class="t" x="775" y="318" text-anchor="middle" font-size="12" fill="#64748b">SERVER &#183; owns the truth</text>
<g>
<circle r="11" fill="#7dd3fc" opacity=".2"/>
<circle r="6" fill="#e0f2fe"/>
<animateMotion dur="3.6s" repeatCount="indefinite" path="M 180 190 Q 320 80 470 160 Q 620 80 760 190 Q 620 80 470 160 Q 320 80 180 190"/>
</g>
<g opacity="0">
<circle r="10" fill="#ef4444" opacity=".25"/>
<circle r="6" fill="#ef4444"/>
<animateMotion dur="7.2s" begin="1.2s" repeatCount="indefinite" path="M 180 215 Q 320 160 464 235 L 464 262" keyPoints="0;0.9;1;1" keyTimes="0;0.2;0.24;1" calcMode="linear"/>
<animate attributeName="opacity" dur="7.2s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.23;0.29;1"/>
</g>
<text class="t" x="470" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#ef4444" opacity="0">&#10007; nice try
<animate attributeName="opacity" dur="7.2s" begin="1.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.20;0.24;0.36;0.44;1"/></text>
<text class="t" x="830" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#22c55e" opacity="0">&#10003;
<animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.46;0.52;0.62;1"/></text>
<text class="t" x="470" y="342" text-anchor="middle" font-size="15" fill="#94a3b8" letter-spacing="1">the server holds the truth. the client just draws it.</text>
</svg>
